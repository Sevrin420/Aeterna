<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BOYZ N THE HOOD — Robinhood Block</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2304060b'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%238fe021' stroke-width='2'/%3E%3C/svg%3E">
<meta name="theme-color" content="#04060b">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="select">
  <div class="logo">
    <span class="l1">BOYZ</span><span class="l2">N THE HOOD</span>
    <span class="sub">ROBINHOOD BLOCK — FOUR BOYZ. ONE BLOCK. ZERO CHANCE OF BEHAVING.</span>
  </div>
  <div id="picks"></div>
  <p class="hint">
    <b>WASD / arrows</b> move &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp;
    <b>Space</b> shoot &nbsp;·&nbsp; <b>E</b> enter car / start mission &nbsp;·&nbsp; <b>M</b> map &nbsp;·&nbsp; <b>Q/1-4</b> weapon &nbsp;·&nbsp; <b>Esc</b> menu
  </p>
</div>

<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="stick"><i></i></div>
  <div id="pad">
    <button id="btnAct" class="tb">E</button>
    <button id="btnFire" class="tb fire">FIRE</button>
  </div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
