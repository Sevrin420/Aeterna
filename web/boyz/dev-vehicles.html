<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOYZ — vehicle reference sheet</title>
<link rel="icon" href="data:,">
<style>
  body { margin:0; background:#04060b; color:#dbe4f5; font:12px "Courier New",monospace; }
  h1 { font-size:13px; color:#8fe021; letter-spacing:2px; margin:16px 20px 4px; }
  p.note { margin:0 20px 14px; color:rgba(160,175,205,.65); max-width:70ch; line-height:1.5; }
  canvas { display:block; margin:0 20px; image-rendering:pixelated; }
</style>
</head>
<body>
<h1>VEHICLE REFERENCE SHEET</h1>
<p class="note">
  Every class at every heading, on a flat field, so silhouettes can be compared
  without the city in the way. Not linked from the game — this exists to check
  that the classes read apart at a glance, which is the whole point of having
  them.
</p>
<canvas id="sheet"></canvas>
<script type="module">
import { drawCar } from './js/sprites.js';
import { VEHICLES, PAINTS } from './js/entities.js';

const ids = Object.keys(VEHICLES);
const angs = [0, Math.PI / 4, Math.PI / 2, Math.PI];
const CELL = 132, ROW = 118, SCALE = 2.2;

const cv = document.getElementById('sheet');
const g = cv.getContext('2d');
cv.width = (CELL * angs.length + 130) * SCALE;
cv.height = (ROW * ids.length + 40) * SCALE;
cv.style.width = cv.width / SCALE + 'px';
g.scale(SCALE, SCALE);

g.fillStyle = '#0f1420';
g.fillRect(0, 0, cv.width, cv.height);

// The renderer projects from world coords, so place each sample at a world
// position that lands where we want it on screen, rather than translating.
import { toScreen } from './js/iso.js';
const origin = toScreen(0, 0, 0);

ids.forEach((id, r) => {
  const v = VEHICLES[id];
  const y = 26 + r * ROW;
  g.fillStyle = '#8fe021';
  g.font = 'bold 11px "Courier New",monospace';
  g.fillText(v.name.toUpperCase(), 8, y + 8);
  g.fillStyle = 'rgba(160,175,205,.6)';
  g.font = '9px "Courier New",monospace';
  g.fillText(`top ${v.topSpeed}  acc ${v.accel}`, 8, y + 22);
  g.fillText(`grip ${v.handling}  m ${v.mass}`, 8, y + 34);
  g.fillText(`hp ${v.hp}`, 8, y + 46);

  angs.forEach((a, c) => {
    g.save();
    g.translate(130 + c * CELL - origin.x, y + 40 - origin.y);
    drawCar(g, 0, 0, a, PAINTS[5], {
      len: v.len, wid: v.wid, ht: v.ht, cab: v.cab, glassW: v.glassW,
      stripe: v.stripe, bed: v.bed, lights: false,
    });
    g.restore();
  });
});
g.fillStyle = 'rgba(160,175,205,.5)';
g.font = '9px "Courier New",monospace';
angs.forEach((a, c) => g.fillText(['E', 'SE', 'S', 'W'][c], 126 + c * CELL, 18));
</script>
</body>
</html>
