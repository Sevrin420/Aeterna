<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <!-- WalletConnect. The project id is PUBLIC — it identifies the dapp to the
       relay and is not a secret — so it lives here rather than in a build.
       Get one free at https://cloud.reown.com. Left empty, the WalletConnect
       path stays shut and Connect falls back to whatever the browser injects. -->
  <meta name="wc-project-id" content="3c2c511cf428c6b19e1478d7e93c4bc0" />
  <!-- The deployed Bloodline collection. Public by nature: anyone can read the
       same values off the chain. The client needs both to call
       bloodlinesOf()/cultistsOf() and to know which chain to ask. -->
  <meta name="bloodline-address" content="0x95819A1623308C06ddA8947b87d6CfA482EEb9DE" />
  <meta name="bloodline-chain-id" content="4663" />
  <!-- Everything the wallet must be TOLD about that chain, for the case where
       it has never heard of it — wallet_addEthereumChain is built from these.
       The launch workflow rewrites all five together, so moving the game to
       another chain is a deploy and not an edit. -->
  <meta name="chain-name" content="Robinhood Chain" />
  <meta name="chain-currency" content="Ether" />
  <meta name="chain-symbol" content="ETH" />
  <meta name="chain-rpc" content="https://rpc.mainnet.chain.robinhood.com/" />
  <meta name="chain-explorer" content="https://robinhoodchain.blockscout.com" />
  <!-- The second way to pay. Read off the CONTRACT at runtime, not from here —
       these two exist only so a page can show the ticker before a wallet is
       connected. Blank means the collection was deployed coin-only. -->
  <meta name="pay-token" content="0xe8fB470E0685437d7739BD2AacBA60b228800335" />
  <meta name="pay-token-symbol" content="THROBBIN" />
  <!-- Everything priced that is not the mint: mini games, entries, anything
       added later. Blank until the tolls contract is deployed. -->
  <meta name="tolls-address" content="0x1FaB0729aFCFdce2c3Ba83725B1974cD2518754b" />
  <title>Throbbin Abbey — Eternal Life</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="console" id="console">
      <img class="console-art" src="assets/console.jpg" alt="" draggable="false" width="1024" height="1536" />

      <!-- Screen -->
      <div class="screen-bezel">
        <canvas id="screen" width="416" height="412"></canvas>
        <div class="boot-veil" id="bootVeil"></div>

        <!-- Chat -->
        <form class="chat-overlay" id="chatForm" hidden>
          <input class="naming-input" id="chatInput" type="text" maxlength="120" autocomplete="off" placeholder="Say something..." />
        </form>

        <!-- HUD overlay -->
        <div class="hud" id="hud" hidden>
          <div class="hud-bar">
            <span class="hud-lvl" id="hudLevel">LV 1</span>
            <div class="hud-xp">
              <div class="hud-xp-fill" id="hudXpFill"></div>
              <span class="hud-xp-txt" id="hudXpTxt"></span>
            </div>
            <span class="hud-dev" id="hudDevotion">0</span>
          </div>
          <div class="hud-sub">
            <span class="hud-name" id="hudName"></span>
            <span class="hud-subright">
              <span class="hud-streak" id="hudStreak"></span>
              <!-- One mark, not a row of them. Three pips told the player
                   exactly how many duties there are before they had done a
                   single one; this lights only when the day is complete and
                   gives no count away. -->
              <span class="hud-duties" id="hudDuties">
                <span class="duty-pip" id="pipDay" title="The day's duties">✦</span>
              </span>
            </span>
          </div>
        </div>

        <!-- Toast -->
        <!-- The message box. Near-fullscreen and it waits: it holds the screen
             until A is pressed, so the hint under the text is not decoration,
             it is the only way out. -->
        <div class="toast" id="toast" hidden>
          <span class="toast-text" id="toastText"></span>
          <span class="toast-hint">PRESS A</span>
        </div>

        <!-- Shown whenever the game is waiting on the server or reading the
             chain. It sits above the overlays on purpose: most of the waiting
             happens with the entrance overlay up, and a spinner underneath it
             would be a spinner nobody sees. -->
        <div class="please-wait" id="pleaseWait" hidden>PLEASE WAIT</div>

        <!-- Shown while the socket is down. The abbey checks a live session
             before it will credit a duty, so a dropped connection is no longer
             only a cosmetic loss of other players — it is the difference
             between a rite counting and not. Without this the first a player
             heard of it was a refusal after they had already performed one. -->
        <div class="net-lost" id="netLost" hidden>THE ABBEY CANNOT SEE YOU</div>

        <div class="emoji-wheel" id="emojiWheel" hidden></div>

        <!-- Entrance: connect wallet + choose your Cultist -->
        <div class="wallet-overlay" id="walletOverlay" hidden>
          <p class="naming-title" id="walletTitle">Enter the Sanctum</p>
          <p class="wallet-msg" id="walletMsg">Connect your wallet to choose your Cultist.</p>
          <div class="cultist-grid" id="cultistGrid" hidden></div>
          <!-- Used by the X-handle and referral rites. One input serves both:
               they are asked one after the other and never at the same time. -->
          <input class="naming-input" id="walletInput" type="text" maxlength="16"
                 autocomplete="off" autocapitalize="none" spellcheck="false" hidden />
          <!-- The mint rite: how many Cultists this Bloodline will hold, fixed
               forever the moment it is raised. -->
          <div class="cultist-slider" id="cultistSlider" hidden>
            <p class="cultist-count" id="cultistCount">1 Cultist</p>
            <!-- Overwritten by paint() with the real price and ticker the
                 moment the mint rite opens. -->
            <p class="cultist-cost" id="cultistCost">—</p>
            <input type="range" id="cultistRange" min="1" max="20" step="1" value="1"
                   aria-label="Cultists in this Bloodline" />
            <p class="cultist-ticks"><span>1</span><span>20</span></p>
          </div>
          <button type="button" class="naming-submit" id="walletSubmit" hidden>Confirm</button>
          <button type="button" class="naming-submit" id="walletSkip" hidden>Not now</button>
          <button type="button" class="naming-submit" id="walletConnect">Connect Wallet</button>
          <button type="button" class="wallet-back" id="walletBack">Back</button>
        </div>

      </div>

      <!-- Mute, and under it Speech. Both are children of .console so they
           share a containing block and therefore actually line up; the emoji
           button was inside .screen-bezel, which is why it could never sit in
           the mute button's column however its percentages were tuned. -->
      <button type="button" class="mute-toggle" id="muteToggle" aria-label="Mute sound" aria-pressed="false">&#9834;</button>
      <button type="button" class="emoji-toggle" id="emojiToggle" aria-label="Emoji">&#9786;</button>

      <!-- Power slider (Club Nile style: wood pill, ON/OFF labels, ridged knob) -->
      <button type="button" class="power-switch" id="powerSwitch" aria-label="Power" aria-pressed="false">
        <span class="power-track">
          <span class="power-txt power-on">ON</span>
          <span class="power-txt power-off">OFF</span>
          <span class="power-knob"></span>
        </span>
      </button>

      <!-- D-Pad: one continuous zone (press once, slide thumb to steer) -->
      <div class="dpad-zone" id="dpad" aria-label="D-pad"></div>

      <!-- Face buttons -->
      <div class="btn-hit btn-a" id="btnA" aria-label="A"></div>
      <div class="btn-hit btn-b" id="btnB" aria-label="B"></div>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
