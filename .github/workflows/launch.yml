# THE WHOLE LAUNCH, IN ONE RUN.
#
# The nine steps that used to be done by hand across three workflows, in the one
# order that works, with the state carried between them automatically. It exists
# because the manual sequence has more ways to go wrong than to go right: the
# price is hardcoded in a different file from the button that uses it, the
# database archive is easy to forget and locks every new player out if it is,
# and opening the mint before the server points at the new collection sells
# Bloodlines the game cannot read.
#
# WHAT IT DOES, in order, stopping at the first failure:
#
#   1. refuses unless `confirm` is typed exactly
#   2. runs the contract tests — a hard gate, nothing is signed if one fails
#   3. closes the mint on the OLD collection, if one was named
#   4. sweeps the OLD collection's balance to team and treasury
#   5. deploys the new contract
#   6. verifies it on the explorer (best effort — a failure here is not fatal)
#   7. takes the founder's free Bloodline
#   8. writes the new address and DEPLOYED_AT into the four places that carry
#      them, and commits
#   9. deploys the server and web, archives the player database, and only then
#      opens the mint
#
# DEPLOYED_AT IS DAY 0. Step 8 is what makes the clock start, which is why the
# database archive in step 9 comes after it and the mint opens after that.
name: LAUNCH — deploy, restart and open

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Which chain. Do the testnet first — the price is immutable.'
        required: true
        default: robinhoodTestnet
        type: choice
        options: [robinhoodTestnet, robinhood, fuji, avalanche]
      confirm:
        description: 'Type LAUNCH to run it. This deploys a contract, ARCHIVES THE PLAYER DATABASE and opens a mint.'
        required: true
        default: ''
      price_per_cultist_wei:
        description: 'IMMUTABLE. 0.01 ETH = 10000000000000000. A 20-Cultist line costs 20x this.'
        required: true
        default: '10000000000000000'
      founder_cultists:
        description: 'Cultists in the founder free line (1-20). 0 to skip the founder mint.'
        required: true
        default: '1'
      old_contract:
        description: 'The PREVIOUS collection, to close and sweep. Blank to skip (a first launch).'
        required: false
        default: ''
      max_supply:
        description: 'IMMUTABLE. Default is uncapped.'
        required: true
        default: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
      base_uri:
        description: 'Where metadata is served. Must end in a slash.'
        required: true
        default: 'https://membersonly.cc/nft/'

concurrency:
  # Two launches at once would deploy two collections and race over which
  # address the server ends up pointing at.
  group: launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    permissions:
      contents: write        # step 8 commits the new address
    steps:
      - name: Refuse unless confirmed
        if: inputs.confirm != 'LAUNCH'
        run: |
          echo "::error::Not confirmed. Re-run and type LAUNCH in the confirm box."
          exit 1

      - name: Say what is about to happen
        run: |
          {
            echo "### Launch"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| network | \`${{ inputs.network }}\` |"
            echo "| price per Cultist | \`${{ inputs.price_per_cultist_wei }}\` wei |"
            echo "| a 20-Cultist line | \`$(( ${{ inputs.price_per_cultist_wei }} / 1000000000000000 * 20 ))\` milli-units |"
            echo "| founder Cultists | \`${{ inputs.founder_cultists }}\` |"
            echo "| previous collection | \`${{ inputs.old_contract || 'none — first launch' }}\` |"
            echo ""
            echo "The player database will be archived and day 0 reset."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          # The default token cannot push in a way that re-triggers workflows,
          # which is what we want: step 8 commits with [skip ci] anyway.
          persist-credentials: true

      - name: Check the secrets are present
        env:
          KEY: ${{ secrets.DEPLOYER_KEY }}
          TEAM: ${{ secrets.TEAM_ADDRESS }}
          TREASURY: ${{ secrets.TREASURY_ADDRESS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for v in KEY TEAM TREASURY VPS_HOST VPS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v"; exit 1; fi
          done
          echo "team     ${TEAM}"
          echo "treasury ${TREASURY}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        working-directory: contracts
        run: npm install --no-audit --no-fund

      # THE GATE. Nothing below signs anything if a single assertion fails.
      - name: Test the contract
        working-directory: contracts
        run: npx hardhat test

      - name: Write .env
        working-directory: contracts
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          TEAM_ADDRESS: ${{ secrets.TEAM_ADDRESS }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
          EXPLORER_KEY: ${{ secrets.EXPLORER_KEY }}
        run: |
          {
            echo "DEPLOYER_KEY=${DEPLOYER_KEY}"
            echo "TEAM_ADDRESS=${TEAM_ADDRESS}"
            echo "TREASURY_ADDRESS=${TREASURY_ADDRESS}"
            echo "EXPLORER_KEY=${EXPLORER_KEY}"
            echo "PRICE_PER_CULTIST_WEI=${{ inputs.price_per_cultist_wei }}"
            echo "MAX_SUPPLY=${{ inputs.max_supply }}"
            echo "BASE_URI=${{ inputs.base_uri }}"
          } > .env

      # ---- 3 & 4: finish with the old collection before starting the new one --
      - name: Close the old mint
        if: inputs.old_contract != ''
        working-directory: contracts
        env:
          MINT_OPEN: 'false'
          CONTRACT_ADDRESS: ${{ inputs.old_contract }}
        run: npx hardhat run scripts/setMint.js --network ${{ inputs.network }}

      - name: Sweep the old collection
        if: inputs.old_contract != ''
        working-directory: contracts
        env:
          CONTRACT_ADDRESS: ${{ inputs.old_contract }}
        run: npx hardhat run scripts/withdraw.js --network ${{ inputs.network }}

      # ---- 5: the new collection ---------------------------------------------
      - name: Deploy
        id: deploy
        working-directory: contracts
        run: |
          npx hardhat run scripts/deploy.js --network ${{ inputs.network }} | tee deploy.log
          # `|| true` so a no-match reaches the message below rather than dying
          # on grep's exit 1 under pipefail — the deploy has already been signed
          # by this point and the operator needs to be told what to look for.
          ADDR=$(grep -oE '^deployed +0x[0-9a-fA-F]{40}' deploy.log | grep -oE '0x[0-9a-fA-F]{40}' || true)
          if [ -z "$ADDR" ]; then echo "::error::Could not read the deployed address from the log. The contract IS deployed — read it off the run log before doing anything else."; exit 1; fi
          echo "address=$ADDR" >> "$GITHUB_OUTPUT"
          echo "Deployed $ADDR"

      - name: Verify on the explorer
        # Best effort. An unverified contract is a shame, not a reason to stop a
        # launch that has already signed a deploy.
        continue-on-error: true
        working-directory: contracts
        env:
          TEAM_ADDRESS: ${{ secrets.TEAM_ADDRESS }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
        run: |
          npx hardhat verify --network ${{ inputs.network }} \
            "${{ steps.deploy.outputs.address }}" \
            "${{ inputs.price_per_cultist_wei }}" \
            "${{ inputs.max_supply }}" \
            "$TEAM_ADDRESS" "$TREASURY_ADDRESS" "${{ inputs.base_uri }}"

      # ---- 7: the founder's line, before anyone else can mint ----------------
      - name: Founder mint
        id: founder
        if: inputs.founder_cultists != '0'
        working-directory: contracts
        env:
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.address }}
          FOUNDER_CULTISTS: ${{ inputs.founder_cultists }}
        run: |
          npx hardhat run scripts/founderMint.js --network ${{ inputs.network }} | tee founder.log
          TOK=$(grep -oE '^founderTokenId +[0-9]+' founder.log | grep -oE '[0-9]+$' || true)
          echo "token=${TOK:-0}" >> "$GITHUB_OUTPUT"

      # ---- 8: point the game at it, and start the clock ----------------------
      - name: Wire the new collection in, and commit
        id: wire
        env:
          ADDR: ${{ steps.deploy.outputs.address }}
          NET: ${{ inputs.network }}
        run: |
          set -e
          # deployedAt is the moment the clock starts. Taken from the deployment
          # record the deploy script just wrote, not from `now`, so DEPLOYED_AT
          # and the record cannot disagree.
          REC="contracts/deployments/${NET}.json"
          DEPLOYED_AT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$REC','utf8')).deployedAt)")
          echo "deployedAt=$DEPLOYED_AT" >> "$GITHUB_OUTPUT"

          node - "$ADDR" "$DEPLOYED_AT" "$NET" <<'JS'
          const fs = require('fs');
          const [addr, deployedAt, net] = process.argv.slice(2);
          // A pattern that no longer matches is a broken launch and stops it.
          // A pattern that matches and is ALREADY the wanted value is not —
          // relaunching on the same chain rewrites the address and the date but
          // leaves the chain identity untouched, and treating "no change" as
          // "the file moved" failed the second launch after the contract had
          // already been deployed.
          const edit = (file, from, to) => {
            const before = fs.readFileSync(file, 'utf8');
            if (!from.test(before)) throw new Error(`nothing to replace in ${file} — pattern moved?`);
            const after = before.replace(from, to);
            if (after !== before) fs.writeFileSync(file, after);
            console.log(`  wired ${file}${after === before ? '  (already)' : ''}`);
          };
          // WHICH CHAIN. Not just the id: a wallet that has never heard of the
          // chain is offered these exact values, and the ticker is what the
          // mint screen prints beside the price. Getting the id right and the
          // ticker wrong sells a line for "0.2 AVAX" and charges ETH.
          const CHAINS = {
            robinhood:        { id: 4663,  name: 'Robinhood Chain',         currency: 'Ether', symbol: 'ETH',
                                rpc: 'https://rpc.mainnet.chain.robinhood.com/', explorer: 'https://robinhoodchain.blockscout.com' },
            robinhoodTestnet: { id: 46630, name: 'Robinhood Chain Testnet', currency: 'Ether', symbol: 'ETH',
                                rpc: 'https://rpc.testnet.chain.robinhood.com/', explorer: 'https://explorer.testnet.chain.robinhood.com' },
            avalanche:        { id: 43114, name: 'Avalanche C-Chain',       currency: 'Avalanche', symbol: 'AVAX',
                                rpc: 'https://api.avax.network/ext/bc/C/rpc', explorer: 'https://snowtrace.io' },
            fuji:             { id: 43113, name: 'Avalanche Fuji',          currency: 'Avalanche', symbol: 'AVAX',
                                rpc: 'https://api.avax-test.network/ext/bc/C/rpc', explorer: 'https://testnet.snowtrace.io' },
          };
          const chain = CHAINS[net];
          if (!chain) throw new Error(`no chain identity recorded for network ${net}`);

          // The address, in the two places a running system reads it.
          edit('web/index.html', /name="bloodline-address" content="0x[0-9a-fA-F]{40}"/,
               `name="bloodline-address" content="${addr}"`);
          edit('server/src/index.js', /\|\| '0x[0-9a-fA-F]{40}';/, `|| '${addr}';`);

          const meta = (name, value) =>
            edit('web/index.html', new RegExp(`name="${name}" content="[^"]*"`), `name="${name}" content="${value}"`);
          meta('bloodline-chain-id', chain.id);
          meta('chain-name', chain.name);
          meta('chain-currency', chain.currency);
          meta('chain-symbol', chain.symbol);
          meta('chain-rpc', chain.rpc);
          meta('chain-explorer', chain.explorer);
          // /collection reports this, and a page whose id disagrees with the
          // server's is exactly the stale-page case that endpoint exists for.
          // The server's RPC is not edited here — it comes from CHAIN_RPC in
          // the service environment, written a few steps below, because the
          // public endpoint is rate-limited and swapping it must not need a
          // commit.
          edit('server/src/index.js', /const CHAIN_ID = Number\(process\.env\.CHAIN_ID \|\| \d+\);/,
               `const CHAIN_ID = Number(process.env.CHAIN_ID || ${chain.id});`);

          // And DAY 0. The trailing comment names the deployment record this
          // has to agree with, so it moves with the network.
          edit('server/src/lib/gameLogic.js',
               /const DEPLOYED_AT = '[^']+';.*/,
               `const DEPLOYED_AT = '${deployedAt}';    // contracts/deployments/${net}.json`);

          // Carried to the step that writes the service environment, so the
          // chain is described in exactly one place in this workflow.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `chainId=${chain.id}\nrpc=${chain.rpc}\n`);
          JS

          git config user.name  'Claude'
          git config user.email 'noreply@anthropic.com'
          git add -A
          # [skip ci] because this job deploys the server itself, a few steps
          # below. Without it the push would fire deploy-server.yml as well and
          # the two would race over restarting the service while the database is
          # being archived.
          git commit -m "LAUNCH: ${NET} ${ADDR}, day 0 ${DEPLOYED_AT} [skip ci]" || echo "nothing to commit"
          git push

      # ---- 9: the server, the database, and only then the mint ---------------
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy the server and the web
        run: |
          rsync -az --delete --exclude 'node_modules' --exclude 'data' --exclude '.env' \
            -e ssh server/ vps:/opt/aeterna-server/
          rsync -az --delete -e ssh web/ vps:/opt/web/
          ssh vps '
            set -e
            cd /opt/aeterna-server
            rm -rf node_modules
            npm ci --omit=dev
            systemctl daemon-reload
            systemctl restart aeterna-server
          '

      - name: Write the server's environment
        env:
          TOKEN: ${{ steps.founder.outputs.token }}
          CHAIN_ID: ${{ steps.wire.outputs.chainId }}
          CHAIN_RPC: ${{ steps.wire.outputs.rpc }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Four settings that must survive a restart and must not need a commit
          # to change: which chain to read, where to read it, which line is the
          # founder's (the one excluded from the standings), and the token that
          # reads the final standings when the run ends.
          #
          # Written by rewriting the whole file rather than appending, so
          # re-running a launch cannot leave two values for the same key.
          {
            echo "CHAIN_ID=${CHAIN_ID}"
            echo "CHAIN_RPC=${CHAIN_RPC}"
            if [ -n "${TOKEN}" ] && [ "${TOKEN}" != "0" ]; then echo "FOUNDER_TOKEN_ID=${TOKEN}"; fi
            if [ -n "${ADMIN_TOKEN}" ]; then echo "ADMIN_TOKEN=${ADMIN_TOKEN}"; fi
          } > env.new
          # Not `cat env.new` — ADMIN_TOKEN is in it.
          sed 's/^ADMIN_TOKEN=.*/ADMIN_TOKEN=(set)/' env.new
          scp env.new vps:/tmp/aeterna-env.new
          ssh vps bash -s <<'REMOTE'
            set -e
            touch /etc/aeterna-server.env
            # Anything the operator set by hand that this launch does not own
            # is kept; the keys below are replaced.
            grep -vE '^(CHAIN_ID|CHAIN_RPC|FOUNDER_TOKEN_ID|ADMIN_TOKEN)=' /etc/aeterna-server.env > /tmp/aeterna-env.keep || true
            cat /tmp/aeterna-env.keep /tmp/aeterna-env.new > /etc/aeterna-server.env
            chmod 600 /etc/aeterna-server.env
            grep -q 'EnvironmentFile=-\?/etc/aeterna-server.env' /etc/systemd/system/aeterna-server.service \
              || sed -i '/^\[Service\]/a EnvironmentFile=-/etc/aeterna-server.env' /etc/systemd/system/aeterna-server.service
            systemctl daemon-reload
            systemctl restart aeterna-server
            rm -f /tmp/aeterna-env.new /tmp/aeterna-env.keep
          REMOTE

      - name: Archive the player database and start a fresh run
        run: |
          # NOT optional. Token ids start at 1 again on a new collection, and
          # /bind refuses a token already bound to a row — so without this the
          # first person to mint the new #1 is told it belongs to somebody else
          # and cannot get into the abbey at all.
          ssh vps bash -s <<'REMOTE'
            set -e
            cd /opt/aeterna-server
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            systemctl stop aeterna-server
            mkdir -p data/archive
            for f in data/aeterna.db data/aeterna.db-wal data/aeterna.db-shm; do
              [ -f "$f" ] && mv "$f" "data/archive/$(basename $f).$STAMP" || true
            done
            echo "archived as data/archive/aeterna.db.$STAMP"
            systemctl start aeterna-server
            sleep 2
            systemctl --no-pager --lines=5 status aeterna-server
          REMOTE

      - name: Check the abbey answers, and is on the new collection
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://membersonly.cc/health >/dev/null; then break; fi
            echo "not up yet — retrying in $((i * 5))s"; sleep $((i * 5))
          done
          COLL=$(curl -fsS --max-time 10 https://membersonly.cc/collection)
          echo "$COLL"
          echo "$COLL" | grep -qi "${{ steps.deploy.outputs.address }}" \
            || { echo "::error::The server is not reading the new collection."; exit 1; }

      # LAST. Nobody can mint into a collection the server is not yet reading.
      - name: Open the mint
        working-directory: contracts
        env:
          MINT_OPEN: 'true'
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.address }}
        run: npx hardhat run scripts/setMint.js --network ${{ inputs.network }}

      - name: What just happened
        if: always()
        run: |
          {
            echo ""
            echo "### Result"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| contract | \`${{ steps.deploy.outputs.address }}\` |"
            echo "| chain | \`${{ inputs.network }}\` (id \`${{ steps.wire.outputs.chainId }}\`) |"
            echo "| day 0 | \`${{ steps.wire.outputs.deployedAt }}\` |"
            echo "| founder token | \`${{ steps.founder.outputs.token || 'skipped' }}\` |"
            echo ""
            if [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
              echo "> **ADMIN_TOKEN is not set as a repository secret.** Without it"
              echo "> \`/admin/standings\` stays a 404 and the final totals cannot be"
              echo "> read when the run ends. Set it and re-run this workflow, or put"
              echo "> it in \`/etc/aeterna-server.env\` by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shred the key
        if: always()
        run: rm -f contracts/.env env.new
