name: Deploy Aeterna Server

on:
  # any push to main ships: syncs code, restarts the server, keeps HTTPS up.
  # (No path filter — web/ changes deploy too, not just server/.)
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aeterna-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync server code
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/aeterna-server/"

      # server/src/index.js resolves its static webRoot as ../../web relative
      # to src/, i.e. a sibling of /opt/aeterna-server — so the frontend has
      # to land at /opt/web or Fastify's static plugin fails to register and
      # the service crash-loops (this was previously missing entirely).
      - name: Sync web frontend
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            web/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/web/"

      - name: Install deps and restart service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/aeterna-server
            rm -rf node_modules
            npm ci --omit=dev
            # The unit previously hardcoded /usr/bin/node (v18.19.1, ABI 109),
            # but a plain SSH session (and this npm ci) resolves to
            # /usr/local/bin/node (v22.22.3, ABI 127) -- two parallel Node
            # installs on this box left the unit and the native deps
            # ABI-mismatched, crash-looping better-sqlite3 on every restart.
            # Point the unit at the same Node npm ci just built against.
            sed -i "s#ExecStart=/usr/bin/node #ExecStart=/usr/local/bin/node #" /etc/systemd/system/aeterna-server.service
            systemctl daemon-reload
            systemctl restart aeterna-server
            sleep 1
            systemctl --no-pager status aeterna-server
          '

      # Put Caddy in front of the Node app so the game is served over HTTPS on
      # membersonly.cc (clean URL, no :3000, no "Not secure"). Caddy fetches &
      # renews a free Let's Encrypt cert automatically and proxies WebSockets
      # (Socket.io) through untouched. Idempotent: installs only if missing,
      # rewrites the tiny Caddyfile and reloads each run.
      - name: Set up HTTPS reverse proxy (Caddy)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            if ! command -v caddy >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl gnupg
              curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/gpg.key" | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt" | tee /etc/apt/sources.list.d/caddy-stable.list
              apt-get update
              apt-get install -y caddy
            fi
            # open the web ports on the host firewall if ufw is managing it
            if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q "Status: active"; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi
            printf "%s\n" "membersonly.cc {" "    encode gzip" "    reverse_proxy localhost:3000" "}" > /etc/caddy/Caddyfile
            systemctl enable caddy
            systemctl reload caddy 2>/dev/null || systemctl restart caddy
            sleep 2
            systemctl --no-pager status caddy | head -15 || true
          '

      - name: Verify externally reachable
        run: |
          http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ secrets.VPS_HOST }}:3000/" || echo "000")
          echo "Direct HTTP on :3000 -> $http"
          echo "Waiting for Caddy to obtain the TLS certificate..."
          sleep 10
          https="000"
          for i in 1 2 3 4 5 6; do
            https=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://membersonly.cc/" || echo "000")
            echo "Attempt $i: https://membersonly.cc -> $https"
            [ "$https" = "200" ] && break
            sleep 10
          done
          if [ "$https" != "200" ]; then
            echo "::warning::HTTPS not 200 yet. Cert issuance can take a minute on first run; if it persists, ports 80/443 are likely blocked by the cloud provider firewall/security group (they must allow inbound 80 and 443)."
          else
            echo "✅ Live at https://membersonly.cc/"
          fi
