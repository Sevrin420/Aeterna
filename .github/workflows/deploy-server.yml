name: Deploy Aeterna Server

on:
  # any push to main ships: syncs code, restarts the server, keeps HTTPS up.
  # (No path filter — web/ changes deploy too, not just server/.)
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aeterna-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONE CONNECTION, NOT FIVE.
      # sshd on the box used to run the stock `MaxStartups 10:30:100`: once ten
      # UNAUTHENTICATED connections are in flight it starts refusing new ones at
      # random, 30% at the threshold. The box takes constant SSH scanning, so
      # those ten slots were usually most of the way full before a deploy
      # started — sshd's own log showed it entering throttling and dropping
      # connections #10 through #13 from four different addresses. This deploy
      # used to open five separate connections (keyscan, two rsyncs, two remote
      # shells), and every one of them was an independent roll against that 30%.
      # Losing any single roll killed the deploy, sometimes AFTER the code had
      # been synced but BEFORE the service was restarted, which leaves the box
      # serving old code out of new files.
      #
      # So: open one connection, retry it if it is refused, and multiplex
      # everything else over it. ssh-keyscan is gone because it was a sixth
      # connection buying nothing — `accept-new` learns the host key on first
      # contact, which is the same trust-on-first-use the keyscan performed.
      #
      # The box side was raised to `MaxStartups 60:30:100` with
      # `LoginGraceTime 30`, in /etc/ssh/sshd_config.d/01-aeterna-maxstartups.conf
      # — the hard cap stays 100 so worst-case pre-auth memory is unchanged, and
      # a stalled scanner frees its slot in 30s instead of 120s. That lives on
      # the VPS, not in this repo: delete that one file and reload ssh to revert.
      # Keep the multiplexing regardless — it is what makes a refusal survivable
      # rather than merely unlikely.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config
          # Throttling windows in the log last 1-56 seconds, so backing off in
          # growing steps clears one comfortably.
          for i in 1 2 3 4 5 6; do
            if ssh -N -f vps; then
              echo "SSH master established on attempt $i"
              break
            fi
            if [ "$i" = 6 ]; then
              echo "::error::Could not open an SSH connection to the VPS after 6 attempts."
              exit 1
            fi
            echo "Attempt $i refused (MaxStartups throttling?) — retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          ssh -O check vps

      - name: Sync server code
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            -e ssh \
            server/ vps:/opt/aeterna-server/

      # server/src/index.js resolves its static webRoot as ../../web relative
      # to src/, i.e. a sibling of /opt/aeterna-server — so the frontend has
      # to land at /opt/web or Fastify's static plugin fails to register and
      # the service crash-loops (this was previously missing entirely).
      - name: Sync web frontend
        run: |
          rsync -az --delete \
            -e ssh \
            web/ vps:/opt/web/

      - name: Install deps and restart service
        run: |
          ssh vps '
            set -e
            cd /opt/aeterna-server
            rm -rf node_modules
            npm ci --omit=dev
            # The unit previously hardcoded /usr/bin/node (v18.19.1, ABI 109),
            # but a plain SSH session (and this npm ci) resolves to
            # /usr/local/bin/node (v22.22.3, ABI 127) -- two parallel Node
            # installs on this box left the unit and the native deps
            # ABI-mismatched, crash-looping better-sqlite3 on every restart.
            # Point the unit at the same Node npm ci just built against.
            sed -i "s#ExecStart=/usr/bin/node #ExecStart=/usr/local/bin/node #" /etc/systemd/system/aeterna-server.service
            systemctl daemon-reload
            systemctl restart aeterna-server
            sleep 1
            systemctl --no-pager status aeterna-server
          '

      # Put Caddy in front of the Node app so the game is served over HTTPS on
      # membersonly.cc (clean URL, no :3000, no "Not secure"). Caddy fetches &
      # renews a free Let's Encrypt cert automatically and proxies WebSockets
      # (Socket.io) through untouched. Idempotent: installs only if missing,
      # rewrites the tiny Caddyfile and reloads each run.
      - name: Set up HTTPS reverse proxy (Caddy)
        run: |
          ssh vps '
            set -e
            if ! command -v caddy >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl gnupg
              curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/gpg.key" | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt" | tee /etc/apt/sources.list.d/caddy-stable.list
              apt-get update
              apt-get install -y caddy
            fi
            # open the web ports on the host firewall if ufw is managing it
            if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q "Status: active"; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi
            printf "%s\n" "membersonly.cc {" "    encode gzip" "    reverse_proxy localhost:3000" "}" > /etc/caddy/Caddyfile
            systemctl enable caddy
            systemctl reload caddy 2>/dev/null || systemctl restart caddy
            sleep 2
            systemctl --no-pager status caddy | head -15 || true
          '

      - name: Verify externally reachable
        run: |
          http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ secrets.VPS_HOST }}:3000/" || echo "000")
          echo "Direct HTTP on :3000 -> $http"
          echo "Waiting for Caddy to obtain the TLS certificate..."
          sleep 10
          https="000"
          for i in 1 2 3 4 5 6; do
            https=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://membersonly.cc/" || echo "000")
            echo "Attempt $i: https://membersonly.cc -> $https"
            [ "$https" = "200" ] && break
            sleep 10
          done
          if [ "$https" != "200" ]; then
            echo "::warning::HTTPS not 200 yet. Cert issuance can take a minute on first run; if it persists, ports 80/443 are likely blocked by the cloud provider firewall/security group (they must allow inbound 80 and 443)."
          else
            echo "✅ Live at https://membersonly.cc/"
          fi

      # Hand the connection back rather than letting ControlPersist hold it open
      # for ten more minutes — those are exactly the unauthenticated-ish slots
      # the next deploy is competing for.
      - name: Close the SSH connection
        if: always()
        run: ssh -O exit vps 2>/dev/null || true
